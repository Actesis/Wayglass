<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayglass data-table stories</title>
    <link rel="stylesheet" href="/packages/tokens/dist/tokens.css" />
    <link rel="stylesheet" href="/packages/themes/dist/themes.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { render } from 'lit';
      import {
        renderDataTableEnvelope,
        renderDataTableStates,
        renderDataTableValidation,
        renderDataTableWorkspace,
      } from '/apps/storybook/stories/data-table.fixture.ts';

      const parameters = new URLSearchParams(window.location.search);
      const fixture = parameters.get('fixture') ?? 'workspace';
      document.documentElement.dir = parameters.get('direction') === 'rtl' ? 'rtl' : 'ltr';
      const options = {
        width: parameters.get('width') ?? 'desktop',
        theme: parameters.get('theme') ?? 'wayglass-dark',
        density: parameters.get('density') ?? 'compact',
      };
      const template =
        fixture === 'validation'
          ? renderDataTableValidation(options)
          : fixture === 'states'
            ? renderDataTableStates(options)
            : fixture === 'envelope'
              ? renderDataTableEnvelope(options)
              : renderDataTableWorkspace(options);
      const started = performance.now();
      render(template, document.querySelector('#root'));
      window.dataTableConstructionDuration = performance.now() - started;
    </script>
  </body>
</html>
