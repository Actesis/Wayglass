<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayglass telemetry-data fixture</title>
    <link rel="stylesheet" href="/packages/tokens/dist/tokens.css" />
    <link rel="stylesheet" href="/packages/themes/dist/themes.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { render } from 'lit';
      import {
        renderTelemetryEnvelope,
        renderTelemetryStress,
        renderTelemetryWorkspace,
      } from '/apps/storybook/stories/telemetry-data.fixture.ts';

      const parameters = new URLSearchParams(window.location.search);
      const fixture = parameters.get('fixture') ?? 'workspace';
      const options = {
        width: parameters.get('width') ?? 'desktop',
        theme: parameters.get('theme') ?? 'wayglass-dark',
        density: parameters.get('density') ?? 'compact',
      };
      const composition =
        fixture === 'stress'
          ? renderTelemetryStress(options)
          : fixture === 'envelope'
            ? renderTelemetryEnvelope(options)
            : renderTelemetryWorkspace(options);
      const started = performance.now();
      render(composition, document.querySelector('#root'));
      window.telemetryConstructionDuration = performance.now() - started;
    </script>
  </body>
</html>
