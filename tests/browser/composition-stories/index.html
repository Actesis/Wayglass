<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayglass filter and command composition stories</title>
    <link rel="stylesheet" href="/packages/tokens/dist/tokens.css" />
    <link rel="stylesheet" href="/packages/themes/dist/themes.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { render } from 'lit';
      import {
        renderCompositionFeedback,
        renderCompositionNoMatches,
        renderCompositionWorkspace,
      } from '/apps/storybook/stories/composition-bars.fixture.ts';

      const parameters = new URLSearchParams(window.location.search);
      const fixture = parameters.get('fixture') ?? 'workspace';
      document.documentElement.dir = parameters.get('direction') === 'rtl' ? 'rtl' : 'ltr';
      const options = {
        width: parameters.get('width') ?? 'desktop',
        theme: parameters.get('theme') ?? 'wayglass-dark',
        density: parameters.get('density') ?? 'compact',
      };
      const template =
        fixture === 'feedback'
          ? renderCompositionFeedback(options)
          : fixture === 'no-matches'
            ? renderCompositionNoMatches(options)
            : renderCompositionWorkspace(options);
      render(template, document.querySelector('#root'));
    </script>
  </body>
</html>
