<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayglass scalar-data fixture</title>
    <link rel="stylesheet" href="/packages/tokens/dist/tokens.css" />
    <link rel="stylesheet" href="/packages/themes/dist/themes.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { render } from 'lit';
      import {
        renderScalarDataEnvelope,
        renderScalarDataWorkspace,
      } from '/apps/storybook/stories/scalar-data.fixture.ts';

      const parameters = new URLSearchParams(window.location.search);
      const fixture = parameters.get('fixture') ?? 'workspace';
      const options = {
        width: parameters.get('width') ?? 'desktop',
        theme: parameters.get('theme') ?? 'wayglass-dark',
        density: parameters.get('density') ?? 'compact',
      };
      const started = performance.now();
      render(
        fixture === 'envelope'
          ? renderScalarDataEnvelope(options)
          : renderScalarDataWorkspace(options),
        document.querySelector('#root'),
      );
      window.scalarConstructionDuration = performance.now() - started;
    </script>
  </body>
</html>
