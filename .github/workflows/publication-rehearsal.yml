name: Public archive and consumer rehearsal (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-review
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.repository == 'Actesis/Wayglass' && github.ref == 'refs/heads/main'
    environment: npm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      TURBO_FORCE: 'true'
      WRANGLER_SEND_METRICS: 'false'
      SOURCE_COMMIT: ce400e89930a047c6af1c6992c64cfe422a1eeee
      PLAYWRIGHT_BROWSERS_PATH:
        ${{ runner.temp }}/wayglass-public-review-browsers-${{ github.run_id }}-${{
        github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Install exact package manager and fresh tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.9.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts --store-dir .pnpm-store
      - name: Validate tooling without restored caches
        run: pnpm check
      - name: Authenticate source and establish new review output
        shell: bash
        run: |
          set -euo pipefail
          pnpm release-candidate:check -- --source "$SOURCE_COMMIT"
          review_root=$(mktemp -d)
          echo "REVIEW_PATH=$review_root" >> "$GITHUB_ENV"
      - name: Provision frozen source dependencies (not an offline proof)
        shell: bash
        run: |
          set -euo pipefail
          provisioning_root=$(mktemp -d)
          frozen_checkout="$provisioning_root/source"
          git worktree add --detach "$frozen_checkout" "$SOURCE_COMMIT"
          trap 'git worktree remove --force "$frozen_checkout"' EXIT
          pnpm --dir "$frozen_checkout" install --frozen-lockfile --ignore-scripts --store-dir "$GITHUB_WORKSPACE/.pnpm-store"
      - name: Provision external consumer material and browser binaries (not an offline proof)
        shell: bash
        run: |
          set -euo pipefail
          pnpm release-candidate:provision-consumers -- --store "$GITHUB_WORKSPACE/.pnpm-store" --output "$REVIEW_PATH/material-locks"
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Assemble public-review archives twice offline and verify
        shell: bash
        run: |
          set -euo pipefail
          pnpm release-candidate:build-publication -- --source "$SOURCE_COMMIT" --output "$REVIEW_PATH/assembly"
          pnpm release-candidate:verify-publication -- --evidence "$REVIEW_PATH/assembly/publication-evidence.json"
      - name: Test those exact archives in offline independent consumers
        shell: bash
        run: |
          set -euo pipefail
          pnpm release-candidate:probe-publication -- --evidence "$REVIEW_PATH/assembly/publication-evidence.json" --store "$GITHUB_WORKSPACE/.pnpm-store" --output "$REVIEW_PATH/proof"
          pnpm release-candidate:verify-publication-consumers -- --evidence "$REVIEW_PATH/proof/consumer-proof.json"
      - name: Bind review output to this hosted run (not provenance)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { createHash } from 'node:crypto';
          const root = process.env.REVIEW_PATH;
          const proof = readFileSync(resolve(root, 'proof/consumer-proof.json'));
          if (JSON.parse(proof).tooling.commit !== process.env.GITHUB_SHA) throw new Error('Tooling SHA mismatch.');
          writeFileSync(resolve(root, 'hosted-run.json'), `${JSON.stringify({
            schemaVersion: 1, publicationAuthorized: false, distTag: null,
            repository: process.env.GITHUB_REPOSITORY, ref: process.env.GITHUB_REF,
            toolingCommit: process.env.GITHUB_SHA, sourceCommit: process.env.SOURCE_COMMIT,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflow: process.env.GITHUB_WORKFLOW, event: process.env.GITHUB_EVENT_NAME,
            proofPath: 'proof/consumer-proof.json',
            proofSha256: createHash('sha256').update(proof).digest('hex'),
          }, null, 2)}\n`, { flag: 'wx' });
          NODE
      - name: Retain successful review bundle only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-review-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.REVIEW_PATH }}/
          if-no-files-found: error
          retention-days: 7
