name: Temporary Phase 5D Node 22 Linux validation

on:
  push:
    branches:
      - codex/phase-5d-node22-linux-validation

permissions:
  contents: read

jobs:
  validate:
    name: Node 22.13 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the validation revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.9.0

      - name: Record environment
        run: |
          node --version
          pnpm --version
          uname -a
          cat /etc/os-release

      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate the unchanged Phase 5D proof
        run: pnpm experiment:phase5d:check

      - name: Record authenticated artifact hashes
        run: |
          sha256sum experiments/phase-5d-icon-tooling/generated/output-manifest.json
          sha256sum experiments/phase-5d-icon-tooling/generated/review-index.html
          sha256sum experiments/phase-5d-icon-tooling/generated/runtime-catalog.ts
          sha256sum experiments/phase-5d-icon-tooling/generated/source-manifest.json

      - name: Run the complete repository gate
        run: pnpm check

      - name: Verify no tracked output changed
        run: |
          git diff --exit-code
          git diff --cached --exit-code
